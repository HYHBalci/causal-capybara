[project]
name = "capy-sidecar"
version = "0.1.0"
description = "Causal Capybara orchestration sidecar"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["../LICENSE", "../NOTICE"]
authors = [{ name = "Yusufhan Balci" }, { name = "VCESR" }]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14",
  "scikit-learn>=1.3", "statsmodels>=0.14", "linearmodels>=6",
  "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5",
  "PyYAML>=6", "jsonschema>=4.20",
]

[project.optional-dependencies]
io = ["openpyxl>=3.1", "pyreadstat>=1.2", "polars>=0.20", "duckdb>=0.10",
      # Word export renders through this. Without it the exporter now hands back
      # Markdown under a .md name and says why, rather than a .docx Word cannot open.
      "python-docx>=1.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
capy = "capy_sidecar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

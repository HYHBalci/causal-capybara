[project]
name = "capy-py"
version = "0.1.0"
description = "Causal Capybara Python engine adapters"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["../../LICENSE", "../../NOTICE"]
authors = [{ name = "Yusufhan Balci" }, { name = "VCESR" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.optional-dependencies]
learners = ["scikit-learn>=1.3", "statsmodels>=0.14", "linearmodels>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

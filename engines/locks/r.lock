# Causal Capybara -- R engine pins
#
# One line per package: name==version  # why it is here.
#
# HONEST STATUS: these versions were chosen as plausible current CRAN releases
# on a machine that has R 4.4.3 but almost none of these packages installed.
# They have NOT been resolved against a real dependency solve. CI must refresh
# this file on a clean machine (see .github/workflows) before any release, and
# the app records the lock hash on every result so a number can always be traced
# to the stack that produced it.
#
# Regenerate with, from a clean library:
#   Rscript -e 'writeLines(paste0(rownames(installed.packages()), "==",
#                                 installed.packages()[,"Version"]))'

# --- core: the engine will not start without these -------------------------
jsonlite==2.0.0            # the wire format between the sidecar and R
data.table==1.16.4         # fast reads and grouped operations
arrow==17.0.0.1            # the parquet data handle; falls back to CSV when absent

# --- inference plumbing used by the base-R adapters -------------------------
sandwich==3.1.1            # robust and clustered variance estimators
lmtest==0.9.40             # coefficient tests against those variances
survival==3.8.3            # time-to-event outcomes

# --- observational workhorse (plan 7.2) ------------------------------------
MatchIt==4.7.2             # the reference matching implementation
optmatch==0.10.8           # optimal and full matching
cem==1.1.31                # coarsened exact matching
WeightIt==1.3.2            # propensity, entropy and balancing weights
cobalt==4.6.0              # Love plots and balance tables, the field's standard
ebal==0.1.8                # entropy balancing
CBPS==0.23                 # covariate balancing propensity score
PSweight==2.1.1            # augmented weighting and doubly robust estimation
marginaleffects==0.24.0    # g-computation contrasts from a fitted model
twang==2.6                 # boosted propensity scores
SuperLearner==2.0.40       # ensemble nuisance models
sensemakr==0.1.6           # Cinelli-Hazlett sensitivity
EValue==4.1.3              # VanderWeele-Ding E-values
rbounds==2.0               # Rosenbaum bounds for matched designs
mice==3.16.0               # multiple imputation
MatchThem==1.2.1           # matching and weighting inside imputed datasets

